name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  SOLIDITY_VERSION: '0.8.20'

jobs:
  # =============================================================================
  # Linting & Code Quality
  # =============================================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install web app dependencies
        run: cd yieldy/apps/web && npm ci

      - name: Run ESLint on web app
        run: cd yieldy/apps/web && npm run lint || true
        continue-on-error: true

      - name: Run Solhint on contracts
        run: |
          npm install -g solhint
          solhint 'contracts/**/*.sol' || true
        continue-on-error: true

      - name: Check TypeScript compilation
        run: cd yieldy/apps/web && npx tsc --noEmit || true
        continue-on-error: true

  # =============================================================================
  # Smart Contract Tests
  # =============================================================================
  contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run contract tests
        run: npx hardhat test
        env:
          REPORT_GAS: true

      - name: Generate coverage report
        run: npx hardhat coverage || true
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: smart-contracts
          name: contract-coverage
        continue-on-error: true

  # =============================================================================
  # Web App Tests
  # =============================================================================
  web-tests:
    name: Web App Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cultiv8_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: cd yieldy/apps/web && npm ci

      - name: Run unit tests
        run: cd yieldy/apps/web && npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/cultiv8_test
          REDIS_URL: redis://localhost:6379

      - name: Run integration tests
        run: cd yieldy/apps/web && npm run test:integration || true
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/cultiv8_test
          REDIS_URL: redis://localhost:6379
        continue-on-error: true

  # =============================================================================
  # Build Check
  # =============================================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: cd yieldy/apps/web && npm ci

      - name: Build application
        run: cd yieldy/apps/web && npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: yieldy/apps/web/build
          retention-days: 7

  # =============================================================================
  # Security Scan
  # =============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && cd yieldy/apps/web && npm ci

      - name: Run npm audit (root)
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Run npm audit (web)
        run: cd yieldy/apps/web && npm audit --audit-level=high || true
        continue-on-error: true

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

  # =============================================================================
  # Slither Static Analysis (Smart Contracts)
  # =============================================================================
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither
        run: slither . --exclude-dependencies || true
        continue-on-error: true

      - name: Upload Slither results
        uses: actions/upload-artifact@v4
        with:
          name: slither-results
          path: slither-results.json
        if: always()
        continue-on-error: true

  # =============================================================================
  # Summary
  # =============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, contract-tests, web-tests, build, security, slither]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Contract Tests: ${{ needs.contract-tests.result }}"
          echo "Web Tests: ${{ needs.web-tests.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Slither: ${{ needs.slither.result }}"

      - name: Fail if critical jobs failed
        if: |
          needs.contract-tests.result == 'failure' ||
          needs.build.result == 'failure'
        run: exit 1
